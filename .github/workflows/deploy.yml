name: Deploy Backend to EC2

on:
  push:
    branches: [deploy]

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          ECR_REGISTRY: 791990722630.dkr.ecr.us-east-1.amazonaws.com
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN,ECR_REGISTRY
          script: |
            # Configurar AWS credentials en EC2
            mkdir -p ~/.aws
            cat > ~/.aws/credentials << CREDS
            [default]
            aws_access_key_id = $AWS_ACCESS_KEY_ID
            aws_secret_access_key = $AWS_SECRET_ACCESS_KEY
            aws_session_token = $AWS_SESSION_TOKEN
            CREDS
            cat > ~/.aws/config << CFG
            [default]
            region = us-east-1
            CFG

            # Login ECR
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin $ECR_REGISTRY

            # Descargar imagenes
            docker pull $ECR_REGISTRY/itpcargo-backend-ventas:latest
            docker pull $ECR_REGISTRY/itpcargo-backend-despacho:latest

            # Network interna
            docker network create itpcargo-net 2>/dev/null || true

            # Detener contenedores anteriores
            docker stop itpcargo-ventas 2>/dev/null; docker rm itpcargo-ventas 2>/dev/null
            docker stop itpcargo-despacho 2>/dev/null; docker rm itpcargo-despacho 2>/dev/null

            # Levantar Ventas (RDS)
            docker run -d \
              --name itpcargo-ventas \
              --restart unless-stopped \
              --network itpcargo-net \
              -p 8080:8080 \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=3306 \
              -e DB_NAME=itpcargo \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              $ECR_REGISTRY/itpcargo-backend-ventas:latest

            # Levantar Despacho (RDS)
            docker run -d \
              --name itpcargo-despacho \
              --restart unless-stopped \
              --network itpcargo-net \
              -p 8081:8081 \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=3306 \
              -e DB_NAME=itpcargo \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              $ECR_REGISTRY/itpcargo-backend-despacho:latest

            # Limpiar imagenes antiguas
            docker system prune -f

            echo "Deploy completado"
            docker ps --filter name=itpcargo
