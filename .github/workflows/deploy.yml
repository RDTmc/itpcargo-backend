name: Build and Deploy Backend to EC2

on:
  push:
    branches: [deploy]

jobs:
  build-and-deploy:
    name: Build, Push to Docker Hub, Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend Ventas
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST
          file: ./Springboot-API-REST/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-backend-ventas:latest

      - name: Build and push Backend Despacho
        uses: docker/build-push-action@v5
        with:
          context: ./Springboot-API-REST-DESPACHO
          file: ./Springboot-API-REST-DESPACHO/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-backend-despacho:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Login Docker Hub en EC2
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

            # Descargar imagenes de Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-backend-ventas:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-backend-despacho:latest

            # Network interna
            docker network create itpcargo-net 2>/dev/null || true

            # Detener contenedores anteriores
            docker stop itpcargo-ventas 2>/dev/null; docker rm itpcargo-ventas 2>/dev/null
            docker stop itpcargo-despacho 2>/dev/null; docker rm itpcargo-despacho 2>/dev/null

            # Levantar Ventas (RDS)
            docker run -d \
              --name itpcargo-ventas \
              --restart unless-stopped \
              --network itpcargo-net \
              -p 8080:8080 \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=3306 \
              -e DB_NAME=itpcargo \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-backend-ventas:latest

            # Levantar Despacho (RDS)
            docker run -d \
              --name itpcargo-despacho \
              --restart unless-stopped \
              --network itpcargo-net \
              -p 8081:8081 \
              -e DB_ENDPOINT=${{ secrets.DB_ENDPOINT }} \
              -e DB_PORT=3306 \
              -e DB_NAME=itpcargo \
              -e DB_USERNAME=${{ secrets.DB_USERNAME }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/itpcargo-backend-despacho:latest

            # Limpiar imagenes antiguas
            docker system prune -f

            echo "Deploy completado"
            docker ps --filter name=itpcargo
